[project]
name = "echoappearance"
version = "0.0.1"
description = "Efficient residual-CNN distillation of GE B-mode DICOM display appearance"
readme = "README.md"
license = "CC-BY-NC-SA-4.0"
license-files = ["LICENSE"]
authors = [{name = "Elias Stenhede"}, {name = "Arian Ranjbar"}]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "torch>=2.4"]

[project.optional-dependencies]
dev = ["pytest>=7"]
plot = ["matplotlib>=3.9"]
experiments = ["numpy>=1.26", "scipy>=1.11", "pyyaml>=6", "matplotlib>=3.9", "pillow>=10", "zarr>=2.18,<3", "huggingface_hub>=0.27"]

[project.urls]
Repository = "https://github.com/Ahus-AIM/EchoAppearance"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/image_enhancement"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "scripts", "examples", "experiments", "assets", "weights", ".github", ".gitignore", ".gitattributes", "README.md", "LICENSE", "CHANGELOG.md", "CITATION.cff", "pyproject.toml", "uv.lock"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_parser = "conventional"
commit_message = "chore(release): {version} [skip ci]"
allow_zero_version = true
major_on_zero = false
build_command = "uv lock && git add uv.lock && uv build"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog]
mode = "update"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.semantic_release.commit_parser_options]
minor_tags = []
patch_tags = ["chore", "feat", "fix", "perf"]
